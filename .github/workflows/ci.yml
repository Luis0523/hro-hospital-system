name: CI Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  backend-build:
    name: Backend Build & Test (Spring Boot)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verificar existencia de backend/pom.xml
        id: check_pom
        run: |
          if [ -f "backend/pom.xml" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "backend/pom.xml aún no existe. Saltando compilación hasta que se inicialice Spring Boot."
          fi

      - name: Set up JDK 17
        if: steps.check_pom.outputs.exists == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        if: steps.check_pom.outputs.exists == 'true'
        working-directory: ./backend
        run: mvn -B package --file pom.xml -DskipTests

  frontend-build:
    name: Frontend Build & Test (React)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verificar existencia de frontend/package.json
        id: check_pkg
        run: |
          if [ -f "frontend/package.json" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "frontend/package.json aún no existe. Saltando compilación hasta que se inicialice React."
          fi

      - name: Set up Node.js
        if: steps.check_pkg.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        if: steps.check_pkg.outputs.exists == 'true'
        working-directory: ./frontend
        run: npm ci || npm install

      - name: Build Frontend
        if: steps.check_pkg.outputs.exists == 'true'
        working-directory: ./frontend
        run: npm run build --if-present
