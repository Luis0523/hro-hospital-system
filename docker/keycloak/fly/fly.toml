app = "hro-keycloak"
primary_region = "dfw"

[build]
  dockerfile = "Dockerfile"

[env]
  KC_HTTP_ENABLED = "true"
  KC_PROXY_HEADERS = "xforwarded"
  KC_HOSTNAME_STRICT = "false"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  size = "shared-cpu-2x"
  memory = "1gb"
