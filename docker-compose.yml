version: '3.8'

services:
  # Base de Datos PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: hro-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hro_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hro21100909}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - hro-network

  # Keycloak (autenticación simulada local hasta recibir el realm real del hospital)
  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: hro-keycloak
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    environment:
      # Keycloak 25 usa KEYCLOAK_ADMIN / KEYCLOAK_ADMIN_PASSWORD
      # (KC_BOOTSTRAP_ADMIN_* es para Keycloak 26+).
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    ports:
      - "${KEYCLOAK_PORT:-8090}:8080"
    volumes:
      - ./docker/keycloak/realm-hro.json:/opt/keycloak/data/import/realm-hro.json:ro
    networks:
      - hro-network

  # Redis para soporte de eventos / caché
  redis:
    image: redis:7-alpine
    container_name: hro-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - hro-network

  # Backend (Spring Boot)
  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend/Dockerfile
    container_name: hro-backend
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-hro_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-hro21100909}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      # Autenticación: por defecto mock (cabeceras). Para Keycloak definir en el entorno:
      #   HRO_AUTH_MODE=keycloak
      #   SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=http://keycloak:8080/realms/hro
      HRO_AUTH_MODE: ${HRO_AUTH_MODE:-mock}
    ports:
      - "${SERVER_PORT:-8081}:8081"
    depends_on:
      - postgres
      - redis
    networks:
      - hro-network

  # Frontend (React)
  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend/Dockerfile
    container_name: hro-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - hro-network

volumes:
  postgres_data:
  redis_data:

networks:
  hro-network:
    driver: bridge
