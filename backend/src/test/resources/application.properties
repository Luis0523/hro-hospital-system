# Fuerza el perfil `test` en TODAS las pruebas para que usen la base de datos
# en memoria (H2, ver application-test.yml) y NUNCA la PostgreSQL de desarrollo.
# Sin esto, los @SpringBootTest sin @ActiveProfiles caían al perfil `dev` y
# sembraban datos de prueba (especialidades/salas con sufijos aleatorios) en la
# base local.
spring.profiles.active=test
